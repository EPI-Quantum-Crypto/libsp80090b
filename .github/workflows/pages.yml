name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/pub/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/notes
          cp -r site/. _site/
          for f in docs/pub/*/NT-*_libsp80090b_v*.pdf; do
            b=$(basename "$f"); ref=${b%%_*}; lang=${b##*_}
            cp "$f" "_site/notes/${ref}_${lang}"          # stable names: NT-01_en.pdf ...
          done
          ls -R _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
