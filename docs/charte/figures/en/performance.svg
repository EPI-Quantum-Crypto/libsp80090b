<text x="338" y="87" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#11203A" font-weight="bold" font-style="normal" text-anchor="start">instantaneous</text>
<text x="318" y="131" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#1A1A1A" font-weight="normal" font-style="normal" text-anchor="end">Lab 2: 1-bit file</text>
