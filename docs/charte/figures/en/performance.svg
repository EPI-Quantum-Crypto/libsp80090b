<text x="779.738" y="395" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#11203A" font-weight="bold" font-style="normal" text-anchor="start">7 min 54 s</text>
<text x="318" y="439" font-family="Arial, Liberation Sans, sans-serif" font-size="14" fill="#1A1A1A" font-weight="normal" font-style="normal" text-anchor="end">Lab 1: bzip2 compression failing</text>
<rect x="330" y="420" width="522.82" height="26" rx="5" fill="#B03A2E"/>
<rect x="330" y="420" width="509.302" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.35"/>
<text x="860.82" y="439" font-family="Arial, Liberation Sans, sans-serif" font-size="13" fill="#11203A" font-weight="bold" font-style="normal" text-anchor="start">41 to 57 min</text>
